<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Blue Lock</title>

    <link rel="stylesheet" href="cadastro.css">

</head>

<body>

    <main class="pagina-login">

        <section class="caixa-login">

            <div class="cabecalho-login">

                <span class="linha"></span>

                <h1>BLUE LOCK</h1>

                <span class="linha"></span>

            </div>


            <h2>ENTRAR NO PROJETO</h2>

            <p class="subtitulo">
                Entre na sua conta e continue sua jornada.
            </p>


            <form id="formLogin">

                <div class="campo-login">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo-login">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-login"
                >
                    ENTRAR
                </button>

            </form>


            <p id="mensagem-login"></p>


            <div class="separador-login">

                <span></span>

                <p>OU</p>

                <span></span>

            </div>


            <a
                href="cadastro.html"
                class="link-cadastro"
            >
                NÃO POSSUI UMA CONTA?
                <strong>CRIAR CONTA</strong>
            </a>


            <a
                href="index.html"
                class="voltar-login"
            >
                ← VOLTAR PARA O INÍCIO
            </a>

        </section>

    </main>


    <script src="cadastro.js"></script>

</body>

</html>
